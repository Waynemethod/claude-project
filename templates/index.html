<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roblox Rant Channel Finder</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="app">
  <header>
    <h1>Roblox Rant Channel Finder</h1>
    <p class="subtitle">Discover YouTube channels with 5K+ subscribers ranting about Roblox</p>
  </header>

  <div class="controls">
    <div class="search-bar">
      <input id="query" type="text" value="roblox rant" placeholder="Search query..." />
      <select id="sort">
        <option value="subscribers">Subscribers (High to Low)</option>
        <option value="recent">Most Recently Active</option>
      </select>
      <button id="searchBtn" onclick="doSearch()">Search</button>
    </div>
  </div>

  <div id="spinner" class="spinner hidden">
    <div class="spinner-ring"></div>
    <span>Searching YouTube...</span>
  </div>

  <div id="error" class="error-box hidden"></div>

  <div id="results" class="channel-grid"></div>
  <div id="empty" class="empty-state hidden">No channels found matching your search. Try a different query.</div>
</div>

<script>
async function doSearch() {
  const query = document.getElementById('query').value.trim() || 'roblox rant';
  const sort = document.getElementById('sort').value;
  const btn = document.getElementById('searchBtn');
  const spinner = document.getElementById('spinner');
  const errorBox = document.getElementById('error');
  const results = document.getElementById('results');
  const empty = document.getElementById('empty');

  btn.disabled = true;
  btn.textContent = 'Searching...';
  spinner.classList.remove('hidden');
  errorBox.classList.add('hidden');
  results.innerHTML = '';
  empty.classList.add('hidden');

  try {
    const resp = await fetch('/api/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query, sort})
    });
    const data = await resp.json();

    if (data.error) {
      errorBox.textContent = data.error;
      errorBox.classList.remove('hidden');
      return;
    }

    const channels = data.channels || [];
    if (channels.length === 0) {
      empty.classList.remove('hidden');
      return;
    }

    renderChannels(channels);
  } catch (e) {
    errorBox.textContent = 'Network error: ' + e.message;
    errorBox.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Search';
    spinner.classList.add('hidden');
  }
}

function subBadgeClass(subCount) {
  if (subCount >= 100000) return 'badge-green';
  if (subCount >= 10000) return 'badge-yellow';
  return 'badge-gray';
}

function escHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderChannels(channels) {
  const container = document.getElementById('results');
  container.innerHTML = channels.map((ch, i) => {
    const thumb = ch.thumbnail_url
      ? `<img class="channel-thumb" src="${escHtml(ch.thumbnail_url)}" alt="${escHtml(ch.channel_name)}" loading="lazy" />`
      : `<div class="channel-thumb channel-thumb-placeholder">${escHtml(ch.channel_name.slice(0,1).toUpperCase())}</div>`;

    const recentVideosHtml = (ch.recent_videos || []).map(v => `
      <div class="video-item">
        <a href="${escHtml(v.video_url)}" target="_blank" rel="noopener" class="video-title">${escHtml(v.title)}</a>
        <div class="video-meta">
          <span>${escHtml(v.view_count_fmt)} views</span>
          <span>${escHtml(v.published_at)}</span>
        </div>
      </div>
    `).join('');

    const lastUpload = ch.recent_videos && ch.recent_videos[0]
      ? ch.recent_videos[0].published_at
      : 'Unknown';

    return `
    <div class="channel-card">
      <div class="channel-header">
        ${thumb}
        <div class="channel-info">
          <a href="${escHtml(ch.channel_url)}" target="_blank" rel="noopener" class="channel-name">${escHtml(ch.channel_name)}</a>
          <div class="channel-badges">
            <span class="badge ${subBadgeClass(ch.subscriber_count)}">${escHtml(ch.subscriber_count_fmt)} subs</span>
          </div>
          <div class="channel-stats">
            <span class="stat-item"><span class="stat-label">Total Views</span> ${escHtml(ch.total_views_fmt)}</span>
            <span class="stat-item"><span class="stat-label">Videos</span> ${ch.video_count.toLocaleString()}</span>
            <span class="stat-item"><span class="stat-label">Last Upload</span> ${escHtml(lastUpload)}</span>
          </div>
        </div>
      </div>
      ${ch.recent_videos && ch.recent_videos.length > 0 ? `
      <div class="videos-toggle" onclick="toggleVideos(this)">
        <span class="toggle-label">Recent Videos (${ch.recent_videos.length})</span>
        <span class="toggle-arrow">&#9660;</span>
      </div>
      <div class="videos-panel hidden">
        ${recentVideosHtml}
      </div>
      ` : ''}
    </div>`;
  }).join('');
}

function toggleVideos(toggleEl) {
  const panel = toggleEl.nextElementSibling;
  const arrow = toggleEl.querySelector('.toggle-arrow');
  if (panel.classList.contains('hidden')) {
    panel.classList.remove('hidden');
    arrow.style.transform = 'rotate(180deg)';
  } else {
    panel.classList.add('hidden');
    arrow.style.transform = '';
  }
}

document.getElementById('query').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
