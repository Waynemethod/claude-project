<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TikTok Trend Radar</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="app">
  <header>
    <h1>TikTok Trend Radar</h1>
    <p class="subtitle">Spot what multiple creators are posting about right now — before it blows up</p>
  </header>

  <div class="search-bar">
    <input id="query" type="text" placeholder='Search a topic (or leave blank to scan all trending)' />
    <button id="searchBtn" onclick="doScan()">Scan Trends</button>
  </div>

  <div class="quick-tags">
    <span class="tag" onclick="setQuery('')">🔥 Everything</span>
    <span class="tag" onclick="setQuery('drama exposed')">Drama</span>
    <span class="tag" onclick="setQuery('news update')">News</span>
    <span class="tag" onclick="setQuery('celebrity')">Celebrity</span>
    <span class="tag" onclick="setQuery('relationship cheating')">Relationships</span>
    <span class="tag" onclick="setQuery('money finance')">Money</span>
  </div>

  <div id="status" class="status hidden"></div>
  <div id="results"></div>
</div>

<div id="toast-container"></div>

<script>
function setQuery(q) {
  document.getElementById('query').value = q;
  doScan();
}

async function doScan() {
  const query = document.getElementById('query').value.trim();
  const btn = document.getElementById('searchBtn');
  const status = document.getElementById('status');
  const results = document.getElementById('results');

  btn.disabled = true;
  btn.textContent = 'Scanning...';
  status.textContent = 'Scanning TikTok for trending topics... this takes 20-40 seconds.';
  status.className = 'status';
  status.classList.remove('hidden');
  results.innerHTML = '';

  try {
    const resp = await fetch('/api/trends', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query})
    });
    const data = await resp.json();

    if (data.error) {
      status.textContent = 'Error: ' + data.error;
      status.className = 'status error';
      return;
    }

    if (!data.trends || data.trends.length === 0) {
      status.textContent = `Scanned ${data.videos_scanned || 0} videos — no trending topics found. Try a different search.`;
      status.className = 'status warn';
      return;
    }

    status.textContent = `Found ${data.trends.length} trending topics from ${data.videos_scanned} videos.`;
    status.className = 'status success';
    renderTrends(data.trends);
  } catch (e) {
    status.textContent = 'Network error: ' + e.message;
    status.className = 'status error';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Scan Trends';
  }
}

function fmtNum(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
  return n;
}

function timeAgo(ts) {
  const diff = Math.floor(Date.now() / 1000) - ts;
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function heatBadge(creatorCount) {
  if (creatorCount >= 10) return '<span class="badge heat-fire">🔥 On Fire</span>';
  if (creatorCount >= 6) return '<span class="badge heat-hot">Hot</span>';
  return '<span class="badge heat-rising">Rising</span>';
}

function renderTrends(trends) {
  const container = document.getElementById('results');
  container.innerHTML = trends.map((t, i) => `
    <div class="trend-card" id="trend-${i}">
      <div class="trend-header">
        <div class="trend-rank">#${i + 1}</div>
        <div class="trend-main">
          <div class="trend-topic">${escHtml(t.topic)}</div>
          <div class="trend-meta">
            ${heatBadge(t.creator_count)}
            <span class="stat">${t.creator_count} creators posting this</span>
            <span class="stat">${fmtNum(t.total_views)} total views</span>
            <span class="stat muted">newest ${timeAgo(t.newest_post)}</span>
          </div>
        </div>
        <button class="copy-topic-btn" onclick="copyTopic('${escHtml(t.topic).replace(/'/g,"\\'")}')">Copy topic</button>
      </div>

      <div class="video-list">
        ${t.top_videos.map(v => `
          <div class="video-row">
            <div class="video-info">
              <a href="${v.url}" target="_blank" class="video-author">@${escHtml(v.author_name)}</a>
              <span class="video-desc">${escHtml(v.desc.slice(0, 120))}${v.desc.length > 120 ? '...' : ''}</span>
            </div>
            <div class="video-stats">
              <span>${fmtNum(v.views)} views</span>
              <span>${fmtNum(v.likes)} likes</span>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function copyTopic(topic) {
  navigator.clipboard.writeText(topic).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = topic;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
  showToast('Topic copied!');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

document.getElementById('query').addEventListener('keydown', e => {
  if (e.key === 'Enter') doScan();
});
</script>
</body>
</html>
