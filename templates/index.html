<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TikTok Series Finder</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="app">
  <header>
    <h1>TikTok Series Finder</h1>
    <p class="subtitle">Find recent viral US series for your YouTube Shorts</p>
  </header>

  <div class="search-bar">
    <input id="query" type="text" placeholder='e.g. "storytime part 1" or "#part1 drama"' />
    <button id="searchBtn" onclick="doSearch()">Search</button>
  </div>

  <div class="quick-tags">
    <span class="tag" onclick="setQuery('#part1 storytime')">Storytime</span>
    <span class="tag" onclick="setQuery('drama series part 1')">Drama</span>
    <span class="tag" onclick="setQuery('update part 2 viral')">Updates</span>
    <span class="tag" onclick="setQuery('episode 1 tiktok series')">Episodes</span>
    <span class="tag" onclick="setQuery('cheating story part 1')">Cheating</span>
    <span class="tag" onclick="setQuery('relationship drama part 1')">Relationship</span>
  </div>

  <div id="status" class="status hidden"></div>
  <div id="results"></div>

  <!-- Comments modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <h2 id="modal-title">Comments</h2>
      <div id="modal-body"></div>
    </div>
  </div>
</div>

<script>
function setQuery(q) {
  document.getElementById('query').value = q;
  doSearch();
}

async function doSearch() {
  const query = document.getElementById('query').value.trim();
  if (!query) return;

  const btn = document.getElementById('searchBtn');
  const status = document.getElementById('status');
  const results = document.getElementById('results');

  btn.disabled = true;
  btn.textContent = 'Searching...';
  status.textContent = 'Scanning TikTok for viral series... this may take 10-20 seconds.';
  status.className = 'status';
  results.innerHTML = '';

  try {
    const resp = await fetch('/api/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query})
    });
    const data = await resp.json();

    if (data.error) {
      status.textContent = 'Error: ' + data.error;
      status.className = 'status error';
      return;
    }

    if (!data.series || data.series.length === 0) {
      status.textContent = `Scanned ${data.total_videos_scanned || 0} videos — no multi-part series found. Try a different search.`;
      status.className = 'status warn';
      return;
    }

    status.textContent = `Found ${data.series.length} series from ${data.total_videos_scanned} videos scanned.`;
    status.className = 'status success';
    renderSeries(data.series);
  } catch (e) {
    status.textContent = 'Network error: ' + e.message;
    status.className = 'status error';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Search';
  }
}

function fmtNum(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
  return n;
}

function escalationBadge(score) {
  if (score >= 0.7) return '<span class="badge escalate-high">Strong escalation</span>';
  if (score >= 0.4) return '<span class="badge escalate-mid">Growing</span>';
  return '<span class="badge escalate-low">Steady</span>';
}

function renderSeries(series) {
  const container = document.getElementById('results');
  container.innerHTML = series.map((s, i) => `
    <div class="series-card" id="series-${i}">
      <div class="series-header">
        <div>
          <span class="rank">#${i + 1}</span>
          <span class="series-title">${escHtml(s.title)}</span>
        </div>
        <div class="meta">
          <a href="https://www.tiktok.com/@${s.author_name}" target="_blank" class="author">@${escHtml(s.author_name)}</a>
          <span class="stat">${s.part_count} parts</span>
          <span class="stat">${fmtNum(s.total_views)} total views</span>
          ${escalationBadge(s.escalation_score)}
        </div>
      </div>

      <div class="parts-list">
        ${s.parts.map((p, pi) => `
          <div class="part-row">
            <div class="part-info">
              <span class="part-num">Part ${pi + 1}</span>
              <a href="${p.url}" target="_blank" class="part-desc">${escHtml(p.desc.slice(0, 100))}${p.desc.length > 100 ? '...' : ''}</a>
            </div>
            <div class="part-stats">
              <span>${fmtNum(p.views)} views</span>
              <span>${fmtNum(p.likes)} likes</span>
              <span>${fmtNum(p.comments_count)} comments</span>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="actions">
        <button onclick="loadSeriesComments(${i}, ${JSON.stringify(s.parts).replace(/"/g, '&quot;')}, '${escHtml(s.title).replace(/'/g,"\\'")}')">
          Pull all comments
        </button>
        <button class="secondary" onclick="copyNarrative(${i})">Copy narrative</button>
      </div>

      <div id="comments-${i}" class="comments-section hidden"></div>
    </div>
  `).join('');
}

async function loadSeriesComments(idx, parts, title) {
  const section = document.getElementById(`comments-${idx}`);
  section.className = 'comments-section';
  section.innerHTML = '<p class="loading">Fetching comments for all parts...</p>';

  const resp = await fetch('/api/series-comments', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({parts})
  });
  const data = await resp.json();

  let html = `<h3>Comments across all parts</h3>`;
  for (const [vid_id, info] of Object.entries(data.by_video)) {
    const contScore = Math.round(info.continuation_score * 100);
    html += `
      <div class="vid-comments">
        <div class="vid-label">
          ${escHtml(info.desc.slice(0, 80))}
          <span class="cont-score" title="% of comments asking for continuation">${contScore}% want more</span>
        </div>
        <ul>
          ${info.comments.slice(0, 10).map(c => `
            <li>
              <span class="comment-text">${escHtml(c.text)}</span>
              <span class="comment-likes">${fmtNum(c.likes)} likes</span>
            </li>
          `).join('')}
        </ul>
      </div>
    `;
  }

  html += `<button class="copy-btn" onclick="copyComments(${JSON.stringify(JSON.stringify(data.by_video)).replace(/"/g,'&quot;')})">Copy all comments</button>`;
  section.innerHTML = html;
}

function copyNarrative(idx) {
  const card = document.getElementById(`series-${idx}`);
  const title = card.querySelector('.series-title').textContent;
  const parts = [...card.querySelectorAll('.part-row')].map((row, i) => {
    const desc = row.querySelector('.part-desc').textContent;
    const stats = [...row.querySelectorAll('.part-stats span')].map(s => s.textContent).join(' | ');
    return `Part ${i + 1}: ${desc}\n  ${stats}`;
  }).join('\n\n');
  copyToClipboard(`SERIES: ${title}\n\n${parts}`);
  showToast('Narrative copied!');
}

function copyComments(jsonStr) {
  const data = JSON.parse(jsonStr);
  let text = '';
  for (const [, info] of Object.entries(data)) {
    text += `=== ${info.desc.slice(0, 80)} ===\n`;
    info.comments.forEach(c => { text += `• ${c.text}  (${c.likes} likes)\n`; });
    text += '\n';
  }
  copyToClipboard(text);
  showToast('Comments copied!');
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function closeModal() {
  document.getElementById('modal').className = 'modal hidden';
}

document.getElementById('query').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
